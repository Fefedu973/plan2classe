name: plan2classe-local

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${APP_URL:-http://localhost:3001}
    init: true
    ports:
      - "3001:3001"
    environment:
      SERVER_URL: http://server:3000
      NEXT_PUBLIC_SERVER_URL: ${APP_URL:-http://localhost:3001}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: true
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/plan2classe.db
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3001}
      CORS_ORIGIN: ${APP_URL:-http://localhost:3001}
      SOLVER_URL: http://solver:8000
    depends_on:
      solver:
        condition: service_healthy
    volumes:
      - plan2classe-local-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  solver:
    build:
      context: services/solver
      dockerfile: Dockerfile
    init: true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  plan2classe-local-data:
