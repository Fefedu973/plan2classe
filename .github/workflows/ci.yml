name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000
  DATABASE_URL: "file::memory:"
  BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
  BETTER_AUTH_URL: http://127.0.0.1:3000
  CORS_ORIGIN: http://127.0.0.1:3001
  SOLVER_URL: http://127.0.0.1:8000
  NODE_ENV: production

jobs:
  typescript:
    name: TypeScript et build Bun
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restaurer les dépendances
        run: bun install --frozen-lockfile

      - name: Vérifier les types
        run: bun run check-types

      - name: Tester l'authentification, l'API et l'isolation des données
        run: bun test packages/auth/tests packages/api/tests apps/server/tests

      - name: Construire les applications
        run: bun run build

  solver:
    name: Tests du solveur CP-SAT
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/solver
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/solver/requirements.txt

      - name: Installer les dépendances
        run: python -m pip install --requirement requirements.txt

      - name: Exécuter les tests
        run: python -m pytest

  containers:
    name: Images de production
    runs-on: ubuntu-latest
    needs:
      - typescript
      - solver
    env:
      APP_URL: https://plan2classe.example.test
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Activer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Valider la configuration Compose
        run: docker compose -f compose.dokploy.yml config --quiet

      - name: Construire les trois images
        run: docker compose -f compose.dokploy.yml build --parallel
